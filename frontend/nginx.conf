server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Keep the sitemap outside the SPA fallback so crawlers receive the XML asset.
    location = /sitemap.xml {
        default_type application/xml;
        try_files $uri =404;
    }

    # Normalize the accidentally indexed trailing-slash variant.
    location = /sitemap.xml/ {
        return 301 /sitemap.xml;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
