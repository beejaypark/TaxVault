services:

  postgres:
    image: postgres:16-alpine
    container_name: taxvault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taxvault}
      POSTGRES_USER: ${POSTGRES_USER:-taxvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taxvault_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taxvault} -d ${POSTGRES_DB:-taxvault}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - taxvault

  redis:
    image: redis:7-alpine
    container_name: taxvault-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - taxvault

  minio:
    image: minio/minio:latest
    container_name: taxvault-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-taxvault}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-taxvault_dev_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - taxvault

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    container_name: taxvault-keycloak
    restart: unless-stopped
    command:
      - start-dev
      - --http-port=8080
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_dev_password}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/8080"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - taxvault

  backend:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/backend/Dockerfile
    container_name: taxvault-backend
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-taxvault}
      DB_USERNAME: ${POSTGRES_USER:-taxvault}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-taxvault_dev}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FILESYSTEM_DISK: s3
      AWS_ENDPOINT: http://minio:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-taxvault}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-taxvault_dev_password}
      AWS_DEFAULT_REGION: ap-southeast-2
      AWS_BUCKET: ${S3_BUCKET:-taxvault}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - taxvault

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/frontend/Dockerfile
    container_name: taxvault-frontend
    restart: unless-stopped
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npx ng serve --host 0.0.0.0 --port 4200
    networks:
      - taxvault

  nginx:
    image: nginx:1.27-alpine
    container_name: taxvault-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./infrastructure/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - taxvault

networks:
  taxvault:
    name: taxvault
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  keycloak_data:
  backend_vendor:
  frontend_node_modules: