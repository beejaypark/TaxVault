services:

  postgres:
    image: postgres:16-alpine
    container_name: taxvault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taxvault}
      POSTGRES_USER: ${POSTGRES_USER:-taxvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taxvault_dev}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taxvault} -d ${POSTGRES_DB:-taxvault}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - taxvault

  redis:
    image: redis:7-alpine
    container_name: taxvault-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - taxvault

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    container_name: taxvault-keycloak
    restart: unless-stopped
    command:
      - start-dev
      - --http-port=8080
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_dev_password}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080/auth}
      KC_PROXY_HEADERS: xforwarded
    ports:
      - "8081:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./infrastructure/keycloak/realm:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/8080"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - taxvault

  backend:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/backend/Dockerfile
    container_name: taxvault-backend
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_NAME: ${APP_NAME:-TaxVault}
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      APP_KEY: ${APP_KEY:-}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-taxvault}
      DB_USERNAME: ${POSTGRES_USER:-taxvault}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-taxvault_dev}
      DB_QUEUE_RETRY_AFTER: ${DB_QUEUE_RETRY_AFTER:-300}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: database
      OCR_PROVIDER: ${OCR_PROVIDER:-local}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_dev_password}
      DEV_ADMIN_LOGIN_ENABLED: ${DEV_ADMIN_LOGIN_ENABLED:-true}
      DEV_ADMIN_LOGIN: ${DEV_ADMIN_LOGIN:-${KEYCLOAK_ADMIN:-admin}}
      DEV_ADMIN_PASSWORD: ${DEV_ADMIN_PASSWORD:-${KEYCLOAK_ADMIN_PASSWORD:-admin_dev_password}}
      FILESYSTEM_DISK: local
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://keycloak:8080/auth}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080/auth}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-taxvault}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-taxvault-web}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      KEYCLOAK_REDIRECT_URI: ${KEYCLOAK_REDIRECT_URI:-http://localhost:8080/api/auth/oidc/callback}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - backend_storage:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - taxvault

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/frontend/Dockerfile
    container_name: taxvault-frontend
    restart: unless-stopped
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npx ng serve --host 0.0.0.0 --port 4200
    networks:
      - taxvault

  document-worker:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/backend/Dockerfile
    container_name: taxvault-document-worker
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "queue:work", "database", "--queue=default", "--sleep=2", "--tries=2", "--timeout=240"]
    environment:
      APP_NAME: ${APP_NAME:-TaxVault}
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      APP_KEY: ${APP_KEY:-}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-taxvault}
      DB_USERNAME: ${POSTGRES_USER:-taxvault}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-taxvault_dev}
      DB_QUEUE_RETRY_AFTER: ${DB_QUEUE_RETRY_AFTER:-300}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: database
      OCR_PROVIDER: ${OCR_PROVIDER:-local}
      FILESYSTEM_DISK: local
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - backend_storage:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - taxvault

  nginx:
    image: nginx:1.27-alpine
    container_name: taxvault-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./infrastructure/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
      - keycloak
    networks:
      - taxvault

networks:
  taxvault:
    name: taxvault
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  keycloak_data:
  backend_vendor:
  backend_storage:
  frontend_node_modules:
